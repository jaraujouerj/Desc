######################## configuração básica ####################
baseURL = "https://www.desc.eng.uerj.br/"
# baseURL = "http://localhost:1313/"
title = "Departamento de Engenharia de Sistemas e Computação"
theme = "educenter-hugo"

defaultContentLanguage = "pt"
defaultContentLanguageInSubdir = false
enableGitInfo = true
disableKinds = ["taxonomy", "term"]

[frontmatter]
lastmod = [":git", "lastmod", "date", "publishDate"]

############################ paginação ##########################
[pagination]
pagerSize = 6

summaryLength = 10

############################ parâmetros #########################
[params]
logo = "images/logodesc.png"
description = "Site do Departamento de Engenharia de Sistemas e Computação"
author = "João Araujo"

address = "Rua São Francisco Xavier, 524, Maracanã, Rio de Janeiro"
mobile = "indisponível"
email = "indisponível"
echefia = "desc@eng.uerj.br"

top_header = true
chefia = "Felipe Ulrichsen"
subchefia = "Robert Mota"
chefialab = "Giomar Sequeiros"
coordenadorprojeto = "João Araujo"
secretaria = ""

############################# Plugins ##############################

